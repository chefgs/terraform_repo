<text x="565" y="100" font-size="14" fill="#334155" text-anchor="end">MCP: JSON-RPC over stdio</text>
<path d="M511 258 L575 258 L575 330 L639 330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<text x="565" y="330" font-size="14" fill="#334155" text-anchor="end">runs via terminal tool</text>
<path d="M791 330 L849 330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
