<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 436" width="1290" height="436" role="img" aria-label="Inside your machine: the engineer talks to an AI coding tool, which is the MCP host and client. It speaks MCP, JSON-RPC over stdio, to the Terraform MCP server running as a Docker container, and runs the Terraform CLI through a terminal tool. The Terraform CLI drives the Docker engine. Outside the machine: the MCP server reaches registry.terraform.io over HTTPS, and the AI tool calls an AI model service over its model API." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Architecture: where the Terraform MCP server sits</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803D"/></marker></defs>
<rect x="1" y="1" width="1288" height="434" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<rect x="20" y="40" width="1000" height="372" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="44" y="70" font-size="15" fill="#334155" text-anchor="start" font-weight="700">YOUR MACHINE</text>
<rect x="50" y="190" width="150" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="125.0" y="235.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Engineer</text>
<rect x="280" y="170" width="230" height="120" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="395.0" y="225.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">AI coding tool</text>
<text x="395.0" y="245.0" font-size="14" fill="#334155" text-anchor="middle">(MCP host and client)</text>
<rect x="640" y="70" width="280" height="90" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="780.0" y="110.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Terraform MCP server</text>
<text x="780.0" y="130.0" font-size="14" fill="#334155" text-anchor="middle">(Docker container, stdio)</text>
<rect x="640" y="290" width="150" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<text x="715.0" y="335.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Terraform CLI</text>
<rect x="850" y="290" width="150" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<text x="925.0" y="335.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Docker engine</text>
<rect x="1070" y="70" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1170.0" y="110.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Terraform Registry</text>
<text x="1170.0" y="130.0" font-size="14" fill="#334155" text-anchor="middle">registry.terraform.io</text>
<rect x="1070" y="290" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1170.0" y="335.0" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">AI model service</text>
