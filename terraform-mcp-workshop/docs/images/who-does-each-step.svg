<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 330" width="1290" height="330" role="img" aria-label="Side by side comparison of five steps. Manual: the engineer finds docs, writes HCL, fixes errors, reviews the plan and approves apply. AI-driven with MCP: the AI finds docs through MCP and writes HCL, the AI fixes errors with the engineer checking, and the engineer still reviews the plan and approves apply." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
